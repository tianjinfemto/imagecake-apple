# 首次构建与回归：GitHub Actions 的 macOS runner。
#
# 为什么需要它：开发机是 Windows，没有 xcodebuild/Swift；这份工作流是
# "能不能编译"的最短验证路径。job 分工明确——
#   · macos-test：App 宿主式单测（148 格），验证几何/色彩/容器/预设契约；
#   · ios-build：先构建 iOS Simulator 目标抓平台特有的编译错误
#     （UIKit/AppKit 分支、Info.plist 键、SwiftUI 的 iOS-only API），
#     再在同一个 job 里把同一批断言在模拟器上真跑一遍；
#   · ios-unsigned-ipa：产出未签名 ipa 给侧载（只在 main / 手动触发时跑）。
# iOS 要跑测试的理由不是"多一层保险"：`#if os(iOS)` 包住的代码
# （PhotoLibraryWriter / 相册写回）在 macOS 上根本不存在，一行都没执行过。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-test:
    name: macOS · build + tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          for v in 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          # supportedDestinations（单 target 双端）需要 >= 2.42。
          xcodegen version

      - name: Validate model manifest
        # 清单是唯一真相：这一步只读不下载，能在构建前抓住 JSON/字段错误。
        run: python3 scripts/fetch_models.py --list

      - name: Generate project
        run: |
          set -euo pipefail
          xcodegen generate
          ls -la ImageCake.xcodeproj

      - name: Test on macOS
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ImageCake.xcodeproj \
            -scheme ImageCake \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Test.xcresult \
            test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: build/Test.xcresult
          if-no-files-found: ignore

  ios-build:
    name: iPadOS · build + tests (simulator)
    runs-on: macos-15
    # 比原来宽：启动一台冷模拟器就要一分多钟。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          for v in 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen version

      - name: Generate project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ImageCake.xcodeproj \
            -scheme ImageCake \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            build

      - name: Test on iOS Simulator
        # 为什么要在 iOS 上再跑一遍同名断言：macOS 那 148 格碰不到 `#if os(iOS)` 的
        # 代码（PhotoLibraryWriter、相册写回），而 iPad 才是 v1 的主目标——
        # 「编得过」不等于「在 iOS 运行时上起得来」。
        #
        # 设备名不写死：runner 镜像换了 Xcode 就没有那台设备，xcodebuild 会直接报
        # "Unable to find a device"，红得让人误以为代码有问题。从 simctl 的 JSON
        # 里挑一台现成的 iPhone（主屏小、跑得比 iPad 快），挑不到就 fail 并打印可用列表。
        run: |
          set -euo pipefail
          # xcresult 路径已存在时 xcodebuild 会直接报错退出，跟测试本身无关。
          rm -rf build/IOSTest.xcresult
          device=$(xcrun simctl list devices -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, items in data.items():
              for d in items:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      print(d["name"]); sys.exit(0)
          sys.exit(1)') || {
            echo "没有可用的 iPhone 模拟器，当前设备列表："
            xcrun simctl list devices | head -60
            exit 1
          }
          echo "选用模拟器：$device"
          xcodebuild \
            -project ImageCake.xcodeproj \
            -scheme ImageCake \
            -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/IOSTest.xcresult \
            test

      - name: Upload iOS test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: build/IOSTest.xcresult
          if-no-files-found: ignore

  # 未签名 ipa 产物：给没有 Mac 的人用 Sideloadly / AltStore 重签后装到 iPad。
  #
  # 为什么用 build 而不是 archive：archive 会把产物套一层 .xcarchive 目录，
  # 而侧载工具只要 Payload/ImageCake.app；直接取 Release-iphoneos 的 .app 更直。
  #
  # 只在推 main 或手动触发时跑：PR 上每次产出几十 MB 的 artifact 没有意义。
  # 手动触发：Actions → CI → Run workflow。
  ios-unsigned-ipa:
    name: iPadOS · unsigned ipa
    runs-on: macos-15
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          for v in 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen version

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ImageCake.xcodeproj \
            -scheme ImageCake \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package ipa
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/ImageCake.app"
          if [ ! -d "$APP" ]; then
            echo "找不到 $APP，实际产物："
            find build/DerivedData/Build/Products -maxdepth 2 -name '*.app' || true
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry ImageCake-unsigned.ipa Payload)
          ls -lh build/ImageCake-unsigned.ipa

      - name: Inspect payload
        # 这一步是给侧载失败时看的：如果 onnxruntime 是**动态** framework，
        # 重签工具需要逐个签名嵌套的 .framework；静态链接进主二进制就没这个问题。
        run: |
          set -euo pipefail
          APP="build/Payload/ImageCake.app"
          echo "=== App 总大小 ==="
          du -sh "$APP"
          echo "=== 主二进制 ==="
          ls -lh "$APP/ImageCake"
          echo "=== 嵌套 framework / dylib（重签时需要逐个处理）==="
          find "$APP" \( -name '*.framework' -o -name '*.dylib' \) -print \
            | sed "s|$APP/||" || echo "（无：依赖都是静态链接）"
          echo "=== Frameworks 目录 ==="
          ls -la "$APP/Frameworks" 2>/dev/null || echo "（没有 Frameworks 目录：全部静态链接）"

      - name: Write install notes
        # 不用 heredoc：YAML 块标量会给每一行加缩进，而 heredoc 的结束标记
        # 必须顶格才能被 bash 识别，否则整个 step 会挂住。
        run: |
          set -euo pipefail
          {
            echo "ImageCake 未签名 ipa（iPadOS）"
            echo "==============================="
            echo ""
            echo "这个包没有签名，不能直接安装。需要在你自己的电脑上用 Apple ID 重签："
            echo ""
            echo "Windows："
            echo "  1. 装 Sideloadly（https://sideloadly.io）与它要求的 Apple 驱动"
            echo "  2. 把 ImageCake-unsigned.ipa 拖进 Sideloadly"
            echo "  3. 填你的 Apple ID（免费账号即可），开始"
            echo "  4. iPad 上：设置 → 隐私与安全性 → 开发者模式 → 开 → 重启"
            echo "  5. iPad 上：设置 → 通用 → VPN与设备管理 → 信任你的 Apple ID"
            echo ""
            echo "免费账号签出来的包 7 天过期，到期需重签；付费开发者账号 1 年。"
            echo ""
            echo "安装后先按 docs/device-check.md 的第 1 节冒烟，再逐项验证。"
            echo "注意：权重不随包（*.onnx 不进仓库），首次要在「模型」页下载或从 Files 导入。"
          } > build/INSTALL.txt
          cat build/INSTALL.txt

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: ImageCake-unsigned-ipa
          path: |
            build/ImageCake-unsigned.ipa
            build/INSTALL.txt
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Release 下的性能基线。**只在手动触发时跑**（workflow_dispatch）。
  #
  # 为什么要单独一个 job 而不塞进 macos-test：私有仓库的 macOS 分钟按 10× 折算额度，
  # 而 Release 得重新构建整个 App；前面已经因为跑太密把额度打过一次。
  #
  # 为什么必须存在：本仓踩过一次—— macos-test 默认是 Debug（-Onone + 数组越界
  # 检查），据此量到的 1024² 基线是 81～85 秒，看上去“非上 SIMD/GPU 不可”；
  # 而当时据此做的模糊核改写因在 Debug 里量不出收益而回退 —— Debug 的数
  # 本来就支撑不了关于内存访问模式与 SIMD 收益的任何结论。计时表得知道自己
  # 是什么配置量出来的，这个 job 就是专门提供 Release 那一侧的数的。
  macos-perf-release:
    name: macOS · perf baseline (Release)
    runs-on: macos-15
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          for v in 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen version

      - name: Generate project
        run: xcodegen generate

      - name: Benchmarks (Release configuration)
        run: |
          set -o pipefail
          mkdir -p build
          # ENABLE_TESTABILITY=YES 是必需的：Release 默认关掉它，而测试靠
          # `@testable import ImageCake` 访问 internal 成员，不打开报的是
          # "module 'ImageCake' was not compiled for testing"（本 job 第一次跑就踩到了）。
          # 它只打开符号可见性，不改优化级别，所以量出来的仍然是 Release 的数。
          xcodebuild \
            -project ImageCake.xcodeproj \
            -scheme ImageCake \
            -destination 'platform=macOS' \
            -configuration Release \
            ENABLE_TESTABILITY=YES \
            -derivedDataPath build/PerfDerived \
            -only-testing:ImageCakeTests/RenderBenchmarkTests \
            -only-testing:ImageCakeTests/RenderPrimitivesBenchmarkTests \
            -only-testing:ImageCakeTests/RenderPerfTests \
            test 2>&1 | tee build/perf-release.log

      - name: Show the tables in the job log
        # 基准的全部价值在于能被看见并拿去对比：数字埋在 xcresult 里等于没量。
        if: always()
        run: |
          grep -E '(基准|归因|判定依据|µs/px| ms |Test Suite .Render)' build/perf-release.log || true

