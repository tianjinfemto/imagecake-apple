# XcodeGen 工程定义（macOS + iPadOS 单工程双端）
#   生成：brew install xcodegen && xcodegen generate
#   打开：open ImageCake.xcodeproj
#
# 为什么用 XcodeGen 而不是提交 .xcodeproj：imagecake 的经验是"同一份真相"——
# 平台清单、部署版本、依赖只有这一处可改，不会出现 pbxproj 里两处不一致。
# Swift 语言模式锁 5（不是 6）：strict concurrency 会把 AI 会话与图像缓冲
# 全部标成不可 Sendable，v1 先把功能打通，升级单独一批做。
name: ImageCake

options:
  bundleIdPrefix: com.beautyinapple
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  # ONNX Runtime 官方 SPM 包（Pod 归档 + Objective-C 绑定）。
  # 平台要求：iOS 15 / macOS 14；from 1.16 会解析到可用的最新 tag。
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: "1.16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"

targets:
  ImageCake:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ImageCake
        excludes:
          - "**/*.md"
    # 注意：ImageCake/Resources/Models/ 下如果有 .onnx，会被当成资源随包
    # （.gitignore 不让它们进仓）。想只带 core 档就用
    # `scripts/fetch_models.py --tier core`；不想随包就放在 App 的「模型」页导入。
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_NAME: ImageCake
        PRODUCT_BUNDLE_IDENTIFIER: com.beautyinapple.imagecake
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: ImageCake
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 选择照片进行精修，全部计算在本机完成。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 把精修结果保存回相册。
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        # iPhone + iPad。iPad 是 v1 的主目标，但保留 iPhone 只多一行声明。
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        # macOS 本地跑（未签名）时不因 Team 缺失而失败；上架前换成自己的 Team。
        # 只用 ad-hoc 签名（-），不关掉签名：XCTest 的宿主 App 需要至少 ad-hoc 签名。
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "CODE_SIGNING_REQUIRED[sdk=macosx*]": "NO"

  ImageCakeTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/ImageCakeTests
    dependencies:
      - target: ImageCake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beautyinapple.imagecake.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # 显式写 TEST_HOST：EXECUTABLE_FOLDER_PATH 在 macOS 是
        # Contents/MacOS、在 iOS 是 .app 自身，一条设置两平台同时成立。
        # （不写 hostApplication —— 那不是 XcodeGen 的键。）
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/$(EXECUTABLE_FOLDER_PATH)/$(EXECUTABLE_NAME)"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ImageCake:
    build:
      targets:
        ImageCake: all
        ImageCakeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ImageCakeTests
    archive:
      config: Release
